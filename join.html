<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#081421"><meta name="description" content="頭文字Dブラウザゲームの最大8人オンライン対戦に招待コードで参加"><title>部屋コードで参加 | 頭文字Dブラウザゲーム</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,#1c3b48,#08101a 65%);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#fff}main{width:min(94vw,470px);margin:14vh auto 0;padding:30px 24px;border-radius:18px;background:#101e2dee;box-shadow:0 18px 70px #0009;border:1px solid #ffffff2c}h1{font-size:25px;margin:4px 0}p{color:#aebbc9;line-height:1.8;font-size:14px}label{display:block;color:#e9f1f6;font-size:12px;margin:20px 0 7px}input{width:100%;padding:19px;font-size:24px;font-weight:800;letter-spacing:.28em;text-align:center;border:2px solid #5d758c;border-radius:10px;background:#071420;color:#fff;outline:none;text-transform:uppercase}input:focus{border-color:#f9b377}button{display:block;width:100%;padding:16px;border:0;border-radius:10px;background:#ff9b59;color:#111820;font-size:16px;font-weight:900;margin:14px 0;cursor:pointer}small{color:#98aebd;line-height:1.9;display:block}a{color:#82e5d3;text-decoration:none}#err{min-height:1.6em;color:#ffb5a8;font-size:12px}</style></head><body><main><div style="color:#e8ae78;letter-spacing:.2em;font-size:10px;font-weight:900">TOUGE ONLINE / 8 RACERS</div><h1>部屋コードで参加</h1><p>友達から届いた8文字のコードを入力するだけ。最大8人のレースに参加できます。</p><form id="join"><label for="room">招待コード（8文字）</label><input id="room" maxlength="8" minlength="8" required autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="ABCDEFGH"><div id="err" role="alert"></div><button>部屋に参加 ▶</button></form><small><a href="./index.html">← ゲームトップへ戻る</a><br>このページだけでは対戦できません。別途、中継サーバーが稼働している必要があります。</small></main><script>const field=document.getElementById('room');field.value=(new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'').slice(0,8);document.getElementById('join').addEventListener('submit',e=>{e.preventDefault();const code=field.value.toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'').slice(0,8);if(code.length!==8){document.getElementById('err').textContent='8文字のコードを入力してください';return}const u=new URL('./index.html',location.href);u.searchParams.set('room',code);const relay=new URLSearchParams(location.search).get('relay');if(relay&&/^wss:\/\//.test(relay))u.searchParams.set('relay',relay);location.assign(u.toString())});</script></body></html>
