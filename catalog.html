<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>車両図鑑 3,000台｜尾文字Z</title>
<meta name="description" content="尾文字Z 車両図鑑。既存144台とオリジナル架空車両2,856台、合計3,000台の車名・性能・駆動方式を検索。">
<link rel="canonical" href="https://uni-tadayasu.github.io/initial-d.github.io/catalog.html">
<link rel="icon" href="assets/favicon.png">
<style>
:root{color-scheme:dark}body{background:#0b101a;color:#f6f5ec;font-family:system-ui,'Yu Gothic',sans-serif;margin:0;line-height:1.65}header{position:sticky;top:0;z-index:5;background:#101b29f2;border-bottom:1px solid #556777;padding:12px clamp(16px,4vw,48px);display:flex;align-items:center;gap:20px;flex-wrap:wrap}header img{width:42px;height:42px;object-fit:contain}a{color:#f8cb90}main{max-width:1220px;margin:auto;padding:clamp(15px,3vw,35px)}h1{font-size:clamp(23px,4vw,36px);margin:.8em 0 .3em}p{color:#c2ced8}label{font-size:12px;color:#d8dce1}#filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;padding:15px;background:#132337;border:1px solid #435973;border-radius:12px}input,select{width:100%;padding:12px;background:#081420;color:#fff;border:1px solid #59748a;border-radius:7px;font:inherit;box-sizing:border-box}.grid{margin:17px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.car{background:linear-gradient(150deg,#182a3d,#101924);border:1px solid #44596d;border-radius:9px;padding:15px}.car h2{font-size:15px;margin:8px 0 5px}.car .eyebrow{font-size:10px;color:#e2b885}.car small{color:#b9c6d2}.car .swatch{width:100%;height:5px;border-radius:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar button{background:#284b62;color:white;border:1px solid #638faa;padding:11px;border-radius:8px;cursor:pointer}.toolbar button:disabled{opacity:.35}footer{padding:28px;border-top:1px solid #435063;color:#92a3b2;text-align:center}@media(max-width:650px){#filters{grid-template-columns:1fr 1fr}#filters>label:first-child{grid-column:1/-1}}</style></head><body>
<header><a href="./index.html"><img alt="尾文字Z" src="assets/loading-logo.png"></a><b>尾文字Z / VEHICLE COLLECTION</b><a href="./index.html">ゲームへ戻る</a></header>
<main><h1>車両図鑑 3,000台</h1><p>既存の144台を維持し、追加で2,856台のオリジナル架空シリーズ・グレードを収録。こちらの車両図鑑ではゲーム内の性能値を検索できます。追加車両の3D表示は共通の自動造形システムによる近似モデルです。</p>
<section id="filters"><label>車名・メーカー名を検索<input id="q" type="search" placeholder="例：KAGETSU / AE86"></label><label>メーカー<select id="b"><option value="">すべて</option></select></label><label>並べ替え<select id="sort"><option value="id">登録順</option><option value="hp">馬力が高い順</option><option value="top">最高速が高い順</option><option value="year">年式の新しい順</option></select></label></section>
<div class="toolbar"><p id="stat" role="status">車両を読み込んでいます…</p><div><button id="prev" disabled>前へ</button> <span id="pages">1 / 1</span> <button id="next" disabled>次へ</button></div></div><div id="grid" class="grid"></div>
<noscript>車両一覧を表示するにはJavaScriptを有効にしてください。<a href="./index.html">ゲーム本体から車両を検索できます。</a></noscript></main>
<footer>尾文字Z / オリジナル架空車の名称はゲーム内用です。実在メーカーからの公式ライセンスを示すものではありません。</footer>
<script>
const byId=id=>document.getElementById(id);let data=[],page=0,filtered=[];const size=42;
function render(){let q=byId('q').value.toLocaleLowerCase(),b=byId('b').value,sort=byId('sort').value;filtered=data.filter(x=>(!b||x.brand===b)&&(!q||(x.brand+' '+x.name+' '+x.year).toLocaleLowerCase().includes(q)));if(sort!=='id')filtered.sort((a,b)=>b[sort]-a[sort]);let pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages-1);byId('stat').textContent=`検索結果 ${filtered.length.toLocaleString()} 台 / 全 ${data.length.toLocaleString()} 台`;byId('pages').textContent=`${page+1} / ${pages}`;byId('prev').disabled=page===0;byId('next').disabled=page===pages-1;
 const fragment=document.createDocumentFragment();for(let x of filtered.slice(page*size,(page+1)*size)){let d=document.createElement('article');d.className='car';let e=document.createElement('div');e.className='eyebrow';e.textContent=`#${x.id} / ${x.brand} / ${x.year}`;d.append(e);let h=document.createElement('h2');h.textContent=x.name;d.append(h);let s=document.createElement('small');s.textContent=`${x.hp} PS / ${x.top} km/h / ${x.drive} / ${x.mass} kg`;d.append(s);let c=document.createElement('div');c.className='swatch';c.style.backgroundColor=x.color;d.append(c);fragment.append(d)}byId('grid').replaceChildren(fragment)}
for(let id of ['q','b','sort'])byId(id).addEventListener(id==='q'?'input':'change',()=>{page=0;render()});for(let id of ['prev','next'])byId(id).onclick=()=>{page+=id==='next'?1:-1;render();window.scrollTo({top:175,behavior:'smooth'})};
fetch('./vehicle-catalog.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{data=x;for(let n of [...new Set(x.map(c=>c.brand))].sort()){let o=document.createElement('option');o.value=n;o.textContent=n;byId('b').append(o)}render()}).catch(e=>{byId('stat').textContent='車両一覧を取得できません。公開サイト上で確認してください。'});
</script></body></html>
